spring.application.name=backend

spring.datasource.url=${DATA_SOURCE_URL}
spring.datasource.username=${DATA_SOURCE_NAME}
spring.datasource.password=${DATA_SOURCE_PASSWORD}

#bu satir tablolari olustuma veya degistirme.
#Biz tablolari SQL dosyalariyla oluturduk
#Bundan dolayi da spring'in bunlara dakunmasini istemiyoruz.
spring.jpa.hibernate.ddl-auto=none  

#Spring'in calistirdigi SQL sorgularini terminalde gorecegiz.
spring.jpa.show-sql=true

#SQL'leri daha okunabilir bicimde yazdirir.
spring.jpa.properties.hibernate.format_sql=true
